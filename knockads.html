</script>
<style>
:root{
  --primary:#FFC93C; --secondary:#C81E3A; --accent:#2E7D4F; --warn:#B5651D; --danger:#D6293F;
  --bg:#FBF6EC; --card:#FFFDF8; --card2:#F3ECDC; --border:#E8DFCC;
  --text:#191410; --muted:#6B5F52;
  --glow-pink:0 6px 18px rgba(255,201,60,.35); --glow-blue:0 6px 18px rgba(200,30,58,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Prompt','Noto Sans Thai',sans-serif;font-size:14px;min-height:100vh}
h1,h2,h3,.brand{font-family:'Prompt','Noto Sans Thai',sans-serif;font-weight:700}
a{color:var(--secondary)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:14px;width:100%;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--secondary);box-shadow:var(--glow-blue)}
label{display:block;margin:10px 0 5px;color:var(--muted);font-size:12.5px;font-weight:500}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#D9CDB0;border-radius:5px}::-webkit-scrollbar-track{background:transparent}

/* Layout — top navigation */
#app{display:flex;flex-direction:column;min-height:100vh}
#topnav{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
#topnavInner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 32px;height:64px}
.brand{font-size:19px;letter-spacing:.3px;color:var(--text);white-space:nowrap;margin-right:10px}
.brand span{color:var(--secondary)}
#navgroups{display:flex;align-items:center;gap:2px;height:64px}
.navgrp{position:relative;height:64px;display:flex}
.navgrp-btn{background:transparent;border:none;height:64px;padding:0 14px;font-family:'Prompt','Noto Sans Thai',sans-serif;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:5px;box-shadow:inset 0 -3px 0 transparent;transition:.15s}
.navgrp-btn .car{font-size:9px;opacity:.7}
.navgrp-btn:hover{color:var(--text)}
.navgrp-btn.active{color:var(--text);font-weight:600;box-shadow:inset 0 -3px 0 var(--primary)}
.navgrp.open .navgrp-btn{color:var(--text);background:var(--card2)}
.navdd{display:none;position:absolute;top:64px;left:0;min-width:224px;background:var(--card);border:1px solid var(--border);box-shadow:0 14px 28px rgba(25,20,16,.12);border-radius:0 0 8px 8px;padding:8px;flex-direction:column;gap:1px;z-index:50}
.navgrp.open .navdd{display:flex}
.navdd-item{padding:9px 12px;border-radius:5px;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none}
.navdd-item:hover{background:var(--card2);color:var(--text)}
.navdd-item.active{color:var(--text);font-weight:600;background:rgba(255,201,60,.16);box-shadow:inset 3px 0 0 var(--primary)}
#menuBtn{display:none;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-size:16px;margin-left:auto}
.acctsw{position:relative}
.acctsw-btn{background:var(--card2);border:1px solid var(--border);border-radius:99px;height:34px;padding:0 12px;font-family:'Prompt','Noto Sans Thai',sans-serif;font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:5px;max-width:180px}
.acctsw-btn span.acctname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctsw-btn .car{font-size:8px;opacity:.7;flex-shrink:0}
.acctsw.open .acctsw-btn{border-color:var(--secondary)}
.acctdd{display:none;position:absolute;top:42px;right:0;min-width:240px;max-width:300px;background:var(--card);border:1px solid var(--border);box-shadow:0 14px 28px rgba(25,20,16,.12);border-radius:8px;padding:8px;flex-direction:column;gap:1px;z-index:50}
.acctsw.open .acctdd{display:flex}
.acctdd-item{display:flex;align-items:center;padding:8px 10px;border-radius:5px;font-size:13px;color:var(--text);gap:6px}
.acctdd-item:hover{background:var(--card2)}
.acctdd-item.active{background:rgba(255,201,60,.16);box-shadow:inset 3px 0 0 var(--primary);font-weight:600}
#mobileNav{display:none;position:fixed;inset:0;background:var(--bg);z-index:90;overflow-y:auto;padding:18px;flex-direction:column;gap:2px}
#mobileNav.open{display:flex}
#mobileNav .mnclose{align-self:flex-end;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text);margin-bottom:14px}
#mobileNav .navgroup{font-family:'Prompt','Noto Sans Thai',sans-serif;padding:14px 10px 4px;color:var(--muted);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;font-weight:600}
#mobileNav .navitem{display:flex;align-items:center;padding:11px 12px;border-radius:6px;font-size:14.5px;color:var(--text)}
#mobileNav .navitem.active{background:rgba(255,201,60,.16);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
#main{flex:1;max-width:1600px;width:100%;margin:0 auto;padding:28px 32px 44px}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
#pageTitle{font-family:'Prompt','Noto Sans Thai',sans-serif;font-size:26px;letter-spacing:.3px;font-weight:700}
#pageTitle::after{content:"";display:block;width:52px;height:3px;margin-top:8px;background:var(--primary);border-radius:2px}
#connBadge{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
#connBadge.ok{color:var(--accent);border-color:rgba(46,125,79,.35)}
#connBadge.bad{color:var(--danger);border-color:rgba(214,41,63,.35)}

/* Components */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;box-shadow:0 2px 10px rgba(25,20,16,.05)}
.card h3{font-family:'Prompt','Noto Sans Thai',sans-serif;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text);margin-bottom:12px;font-weight:600}
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
.kpi .lbl{font-family:'Prompt','Noto Sans Thai',sans-serif;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:500}
.kpi .val{font-family:'Prompt','Noto Sans Thai',sans-serif;font-size:21px;font-weight:700;margin:8px 0 4px;color:var(--text)}
.kpi .chg{font-size:12px;font-weight:600}
.chg.up{color:var(--accent)}.chg.down{color:var(--danger)}.chg.flat{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13.5px;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--secondary);box-shadow:var(--glow-blue)}
.btn.primary{background:linear-gradient(135deg,var(--primary),#E0AC2E);border-color:transparent;color:#1A1207;box-shadow:var(--glow-pink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.blue{background:linear-gradient(135deg,#00A8CC,#0077AA);border-color:transparent;color:#fff}
.btn.green{background:linear-gradient(135deg,#2ECC71,#219150);border-color:transparent;color:#04150C}
.btn.danger{background:linear-gradient(135deg,#D6293F,#A11730);border-color:transparent;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

<div id="toasts"></div>
<script>
/* =====================================================================
   Knock Ads by Knock Out — Single-file app (Meta Marketing API v19.0)
   ===================================================================== */
const API = "https://graph.facebook.com/v19.0";
const LS = {
  get(k,d){ try{ const v=localStorage.getItem("mad_"+k); return v===null?d:JSON.parse(v);}catch(e){return d} },
  set(k,v){ localStorage.setItem("mad_"+k, JSON.stringify(v)) },
  del(k){ localStorage.removeItem("mad_"+k) }
};
const S = {
  token: LS.get("token",""),
  act: LS.get("act",""),
  aiKey: LS.get("aiKey",""),
  oaiKey: LS.get("oaiKey",""),
  lineUrl: LS.get("lineUrl",""), lineKey: LS.get("lineKey",""),
  preset: LS.get("preset","last_7d"),
  customSince: LS.get("customSince",""),
  customUntil: LS.get("customUntil",""),
  page: "dashboard",
  cache: {},           // in-memory API cache per session
  drafts: LS.get("drafts",[]),
  rules: LS.get("rules",[]),
  ruleLogs: LS.get("ruleLogs",[]),
  schedule: LS.get("schedule",{enabled:false,hour:9,minute:0,preset:"yesterday"}),
  schedLogs: LS.get("schedLogs",[]),
  reports: LS.get("reports",[]),
  costs: LS.get("costs",[]),
  profiles: LS.get("profiles",[]),
  activeProfileId: LS.get("activeProfileId",null),
  tokenHistory: LS.get("tokenHistory",[]),
  abHistory: LS.get("abHistory",[]),
};
const fmtN = n => (n===undefined||n===null||isNaN(n)) ? "—" : Number(n).toLocaleString("th-TH",{maximumFractionDigits:0});
const fmtB = n => (n===undefined||n===null||isNaN(n)) ? "—" : "฿"+Number(n).toLocaleString("th-TH",{maximumFractionDigits:2});
const fmtP = n => (n===undefined||n===null||isNaN(n)) ? "—" : Number(n).toFixed(2)+"%";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

/* ---------- Toast & Modal ---------- */
function toast(msg, type="info", ms=4200){
  const t=document.createElement("div"); t.className="toast "+type; t.innerHTML=msg;
  $("toasts").appendChild(t); setTimeout(()=>t.remove(),ms);
}
function openModal(html){ $("modalBox").innerHTML=html; $("modalWrap").classList.add("show"); }
function closeModal(){ $("modalWrap").classList.remove("show"); }
$("modalWrap").addEventListener("click",e=>{ if(e.target.id==="modalWrap") closeModal(); });
document.addEventListener("click",e=>{
  if(DD.open!==null && !e.target.closest(".navgrp")){ DD.open=null; renderTopNav(); }
  if(ADSW.open && !e.target.closest(".acctsw")){ ADSW.open=false; renderAccountSwitcher(); }
});

/* ---------- Auth (ระบบล็อกอินลูกค้า — แยกจาก Meta Ads Token ของแต่ละคนโดยสิ้นเชิง) ---------- */
const AUTH_API = "https://knockads-auth.tanapat0038zaza.workers.dev";
const APP_URL = "https://knockads.github.io/knockads/";
const AUTH = {
  token: LS.get("authToken",""),
  user: LS.get("authUserInfo",null), // {username, role, displayName, expiresAt}
};
async function authFetch(path, body){
  const headers={"Content-Type":"application/json"};
  if(AUTH.token) headers["Authorization"]="Bearer "+AUTH.token;
  let r;
  try{ r = await fetch(AUTH_API+path,{method:"POST",headers,body:JSON.stringify(body||{})}); }
  catch(e){ throw new Error("เชื่อมต่อระบบล็อกอินไม่ได้ ตรวจสอบอินเทอร์เน็ต หรือแจ้งผู้ดูแลระบบ"); }
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error||"เชื่อมต่อระบบล็อกอินไม่สำเร็จ");
  return j;
}
function setAuthSession(j){
  AUTH.token=j.token;
  AUTH.user={username:j.username, role:j.role, displayName:j.displayName, expiresAt:j.expiresAt};
  LS.set("authToken",AUTH.token); LS.set("authUserInfo",AUTH.user);
}
function clearAuthSession(){
  AUTH.token=""; AUTH.user=null; LS.del("authToken"); LS.del("authUserInfo");
}
function renderAuthBadge(){
  const el=$("authBadge"); if(!el) return;
  if(AUTH.user){ el.style.display=""; el.textContent="👤 "+(AUTH.user.displayName||AUTH.user.username)+" • ออกจากระบบ"; }
  else el.style.display="none";
}
function confirmLogout(){
  confirmAction("ออกจากระบบ", "คุณจะออกจากระบบ Knock Ads บนเครื่องนี้ (การตั้งค่า Meta Token ยังอยู่ ไม่หาย)", async ()=>{
    clearAuthSession(); location.reload();
  });
}
async function doLogin(e){
  if(e) e.preventDefault();
  const u=$("authUser").value.trim(), p=$("authPass").value;
  $("authErr").textContent="";
  if(!u||!p){ $("authErr").textContent="กรอก Username และ Password ให้ครบ"; return false; }
  $("authBtn").disabled=true; $("authLoading").style.display="block";
  try{
    const j=await authFetch("/login",{username:u,password:p});
    setAuthSession(j);
    onAuthReady();
  }catch(err){
    $("authErr").textContent="❌ "+err.message;
  }finally{
    $("authBtn").disabled=false; $("authLoading").style.display="none";
  }
  return false;
}
async function verifySession(){
  if(!AUTH.token) return false;
  try{ const j=await authFetch("/verify",{}); setAuthSession(j); return true; }
  catch(e){ clearAuthSession(); return false; }
}
function ensureAdminNav(){
  if(AUTH.user && AUTH.user.role==="admin" && !NAV.some(n=>n.id==="admin")){
    const i=NAV.findIndex(n=>n.id==="token");
    NAV.splice(i<0?NAV.length:i,0,{id:"admin",ico:"🛡️",label:"จัดการลูกค้า"});
  }
}
function onAuthReady(){
  $("authGate").classList.remove("show");
  ensureAdminNav();
  renderTopNav(); renderMobileNav(); renderAuthBadge();
  if(!S.token||!S.act){ go("token"); toast("👋 ยินดีต้อนรับ! เริ่มที่หน้า 🔑 Token → กดปุ่ม 📖 คู่มือ เพื่อสร้าง Token/Key ของตัวเอง (ทุกอย่างเก็บในเครื่องคุณเท่านั้น)","info",10000); }
  else go(S.page||"dashboard");
  if(window._authTimer) clearInterval(window._authTimer);
  window._authTimer=setInterval(async()=>{
    const ok=await verifySession();
    if(!ok){ clearInterval(window._authTimer); $("authGate").classList.add("show"); $("authErr").textContent="เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่"; }
    else renderAuthBadge();
  }, 30*60*1000);
}
(async function bootAuth(){
  $("authGate").classList.add("show");
  if(AUTH.token){
    const ok=await verifySession();
    if(ok){ onAuthReady(); return; }
  }
  setTimeout(()=>{ const el=$("authUser"); if(el) el.focus(); },50);
})();

/* ---------- Click-to-sort table headers (ทุกตารางที่มี column เรียงจากมาก↔น้อย หรือ ก↔ฮ ได้) ---------- */
function parseSortableNumber(text){
  const t=(text||"").trim();
  if(t===""||t==="—"||t==="-") return null;
  const n=parseFloat(t.replace(/[^0-9.\-]/g,""));
  return isNaN(n)? null : n;
}
function sortTableByHeader(table, th){
  const headRow=th.parentElement;
  const idx=[...headRow.children].indexOf(th);
  const isNum=th.classList.contains("num");
  let dir=th.getAttribute("data-dir");
  dir = dir==="asc" ? "desc" : (dir==="desc" ? "asc" : (isNum?"desc":"asc"));
  headRow.querySelectorAll("th").forEach(h=>{ h.removeAttribute("data-dir"); h.classList.remove("sort-asc","sort-desc"); });
  th.setAttribute("data-dir",dir); th.classList.add(dir==="asc"?"sort-asc":"sort-desc");
  const tbody=table.tBodies[0]; if(!tbody) return;
  const rows=[...tbody.rows];
  const dataRows=rows.filter(r=>r.cells.length>1);
  const otherRows=rows.filter(r=>r.cells.length<=1); /* colspan "ไม่พบข้อมูล" placeholder rows */
  dataRows.sort((ra,rb)=>{
    const ca=ra.cells[idx], cb=rb.cells[idx]; if(!ca||!cb) return 0;
    if(isNum){
      const inf = dir==="asc" ? Infinity : -Infinity;
      let va=parseSortableNumber(ca.textContent); va = va===null? inf : va;
      let vb=parseSortableNumber(cb.textContent); vb = vb===null? inf : vb;
      return dir==="asc" ? va-vb : vb-va;
    } else {
      const va=(ca.getAttribute("data-sort")||ca.textContent).trim();
      const vb=(cb.getAttribute("data-sort")||cb.textContent).trim();
      return dir==="asc" ? va.localeCompare(vb,"th") : vb.localeCompare(va,"th");
    }
  });
  dataRows.forEach(r=>tbody.appendChild(r));
  otherRows.forEach(r=>tbody.appendChild(r));
}
function initSortableTables(root){
  (root||document).querySelectorAll("table:not(.hm):not(.sort-ready)").forEach(table=>{
    if(!table.tHead || !table.tBodies[0]) return;
    table.classList.add("sort-ready");
    [...table.tHead.rows[0].cells].forEach(th=>{
      if(!th.textContent.trim()) return; /* ข้ามหัวคอลัมน์ที่ว่าง/เป็นแค่ไอคอน */
      th.classList.add("sortable");
      th.insertAdjacentHTML("beforeend",'<span class="sort-arrow">⇅</span>');
      th.addEventListener("click",()=>sortTableByHeader(table,th));
    });
  });
}
new MutationObserver(()=>initSortableTables($("page"))).observe($("page"),{childList:true,subtree:true});
/* Confirmation dialog — every write action must pass through here */
function confirmAction(title, detailsHTML, onConfirm){
  openModal(`<h3>⚠️ ${esc(title)}</h3>
    <div class="small" style="line-height:1.8;margin:8px 0 16px">${detailsHTML}</div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" onclick="closeModal()">ยกเลิก</button>
      <button class="btn primary" id="cfBtn">ยืนยันดำเนินการ</button>
    </div>`);
  $("cfBtn").onclick = async ()=>{ $("cfBtn").disabled=true; $("cfBtn").innerHTML='<span class="spin"></span> กำลังทำงาน...';
    try{ await onConfirm(); closeModal(); }catch(e){ closeModal(); toast("❌ "+esc(e.message),"err",6000); } };
}

/* ---------- Meta API core ---------- */
function parseMetaError(j){
  const e=j&&j.error; if(!e) return "Unknown error";
  let m=e.message||"Meta API error";
  if(e.code===190){
    if(e.error_subcode===463) m="Token หมดอายุแล้ว — กรุณาสร้าง Token ใหม่ในหน้า Token";
    else if(e.error_subcode===467) m="Token ถูกยกเลิก (ผู้ใช้ logout) — กรุณาสร้าง Token ใหม่";
    else if(e.error_subcode===460) m="Token ใช้ไม่ได้ (มีการเปลี่ยนรหัสผ่าน) — กรุณาสร้าง Token ใหม่";
    else m="Token ไม่ถูกต้องหรือหมดอายุ — ตรวจสอบที่หน้า Token";
  } else if(e.code===10||e.code===200||e.code===294) m="ไม่มีสิทธิ์เข้าถึง — Token ต้องมี permissions: ads_read, ads_management ("+m+")";
  else if(e.code===17||e.code===80004) m="เรียก API ถี่เกินไป (Rate limit) — รอสักครู่แล้วลองใหม่";
  return m+(e.error_user_msg?(" • "+e.error_user_msg):"");
}
async function mGET(path, params={}, cacheKey=null){
  if(cacheKey && S.cache[cacheKey]) return S.cache[cacheKey];
  if(!S.token) throw new Error("ยังไม่ได้ตั้งค่า Access Token — ไปที่หน้า 🔑 Token");
  const u = new URL(API+path);
  u.searchParams.set("access_token",S.token);
  for(const [k,v] of Object.entries(params)) if(v!==undefined&&v!==null&&v!=="") u.searchParams.set(k, typeof v==="object"?JSON.stringify(v):v);
  const r = await fetch(u); const j = await r.json();
  if(j.error) throw new Error(parseMetaError(j));
  if(cacheKey) S.cache[cacheKey]=j;
  return j;
}
async function mGETAll(path, params={}, cacheKey=null, maxPages=6){
  if(cacheKey && S.cache[cacheKey]) return S.cache[cacheKey];
  let data=[], j=await mGET(path,{...params,limit:params.limit||200});
  data=data.concat(j.data||[]); let n=1;
  while(j.paging && j.paging.next && n<maxPages){
    const r=await fetch(j.paging.next); j=await r.json();
    if(j.error) throw new Error(parseMetaError(j));
    data=data.concat(j.data||[]); n++;
  }
  if(cacheKey) S.cache[cacheKey]=data;
  return data;
}
async function mPOST(path, body={}){
  if(!S.token) throw new Error("ยังไม่ได้ตั้งค่า Access Token");
  const fd = new URLSearchParams();
  fd.set("access_token",S.token);
  for(const [k,v] of Object.entries(body)) if(v!==undefined&&v!==null) fd.set(k, typeof v==="object"?JSON.stringify(v):v);
  const r = await fetch(API+path,{method:"POST",body:fd});
  const j = await r.json();
  if(j.error) throw new Error(parseMetaError(j));
  return j;
}
async function mPOSTForm(path, formData){
  formData.set("access_token",S.token);
  const r = await fetch(API+path,{method:"POST",body:formData});
  const j = await r.json();
  if(j.error) throw new Error(parseMetaError(j));
  return j;
}

/* ---------- Date ranges (Asia/Bangkok) ---------- */
function bkkToday(){
  const now = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Bangkok"}));
  now.setHours(0,0,0,0); return now;
}
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addD(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
const PRESETS = {
  today:{label:"วันนี้",days:1,off:0}, yesterday:{label:"เมื่อวาน",days:1,off:1},
  last_7d:{label:"7 วัน",days:7,off:1}, last_14d:{label:"14 วัน",days:14,off:1}, last_30d:{label:"30 วัน",days:30,off:1},
};
function presetRange(p){
  if(p==="custom" && S.customSince && S.customUntil){
    return S.customSince<=S.customUntil ? {since:S.customSince, until:S.customUntil} : {since:S.customUntil, until:S.customSince};
  }
  const c=PRESETS[p]||PRESETS.last_7d, t=bkkToday();
  const until=addD(t,-c.off+(c.off===0?0:0)); const u = c.off===0? t : addD(t,-1);
  const s = addD(u,-(c.days-1));
  return {since:ymd(s), until:ymd(u)};
}
function prevRange(p){
  if(p==="custom" && S.customSince && S.customUntil){
    const cur=presetRange(p);
    const days=Math.round((new Date(cur.until)-new Date(cur.since))/86400000)+1;
    const u=addD(new Date(cur.since),-1), s=addD(u,-(days-1));
    return {since:ymd(s), until:ymd(u)};
  }
  const c=PRESETS[p]||PRESETS.last_7d, cur=presetRange(p);
  const u=addD(new Date(cur.since),-1), s=addD(u,-(c.days-1));
  return {since:ymd(s), until:ymd(u)};
}
function pctChange(cur,prev){ if(!prev||prev===0) return null; return (cur-prev)/prev*100; }
function chgHTML(cur,prev,inverse=false){
  const c=pctChange(Number(cur)||0,Number(prev)||0);
  if(c===null) return '<span class="chg flat">—</span>';
  const good = inverse ? c<0 : c>0;
  const cls = Math.abs(c)<0.05?"flat":(good?"up":"down");
  const arrow = c>0?"▲":(c<0?"▼":"■");
  return `<span class="chg ${cls}">${arrow} ${Math.abs(c).toFixed(1)}%</span>`;
}
const actVal=(actions,type)=>{ const a=(actions||[]).find(x=>x.action_type===type); return a?parseFloat(a.value):0; };
const actSum=(actions,types)=>types.reduce((s,t)=>s+actVal(actions,t),0);
const PURCHASE_TYPES=["purchase","omni_purchase","offsite_conversion.fb_pixel_purchase"];
const MSG_TYPES=["onsite_conversion.messaging_conversation_started_7d","messaging_conversation_started_7d"];
const purchases=a=>Math.max(actVal(a,"omni_purchase"), actVal(a,"purchase"), actVal(a,"offsite_conversion.fb_pixel_purchase"));
const messages=a=>Math.max(...MSG_TYPES.map(t=>actVal(a,t)),0);
function cpa(spend, act){ const p=purchases(act)||messages(act); return p>0? spend/p : null; }
function purchaseValue(av){ const v=(av||[]).find(x=>PURCHASE_TYPES.includes(x.action_type)); return v?+v.value:0; }
function closingRate(act){ const m=messages(act), p=purchases(act); return m>0? p/m*100 : null; }
function costPerPurchase(spend, act){ const p=purchases(act); return p>0? (+spend)/p : null; }
function costPerMessage(spend, act){ const m=messages(act); return m>0? (+spend)/m : null; }
function aov(av, act){ const p=purchases(act); return p>0? purchaseValue(av)/p : null; }
function roas(spend, av){ return (+spend)>0? purchaseValue(av)/(+spend) : null; }
/* ---------- Full metric column set (matches Dashboard KPIs) — used by every table page ---------- */
const FULL_METRIC_HEAD = `<th class="num">Spend</th><th class="num">Impr.</th><th class="num">Clicks</th><th class="num">Reach</th><th class="num">CTR</th><th class="num">CPM</th><th class="num">Msg. Started</th><th class="num">Purchases</th><th class="num">Purchases Value</th><th class="num">Closing Rate</th><th class="num">Cost/Purchase</th><th class="num">AOV</th><th class="num">ROAS</th>`;
function fullMetricCells(i){
  const sp=+i.spend||0, act=i.actions, av=i.action_values;
  const msg=messages(act), pur=purchases(act), rev=purchaseValue(av);
  const cr=closingRate(act), cpp=costPerPurchase(sp,act), a=aov(av,act), r=roas(sp,av);
  return `<td class="num">${fmtB(sp)}</td><td class="num">${fmtN(i.impressions)}</td><td class="num">${fmtN(i.clicks)}</td><td class="num">${fmtN(i.reach)}</td>`+
    `<td class="num">${fmtP(i.ctr)}</td><td class="num">${fmtB(i.cpm)}</td><td class="num">${fmtN(msg)}</td><td class="num">${fmtN(pur)}</td>`+
    `<td class="num">${fmtB(rev)}</td><td class="num">${cr!==null?fmtP(cr):"—"}</td><td class="num">${cpp!==null?fmtB(cpp):"—"}</td>`+
    `<td class="num">${a!==null?fmtB(a):"—"}</td><td class="num">${r!==null?r.toFixed(2)+"x":"—"}</td>`;
}
/* Same 13 metrics as fullMetricCells, but as [label,value] pairs for KPI-card grids */
function metricKPIList(i){
  const sp=+i.spend||0, act=i.actions, av=i.action_values;
  const msg=messages(act), pur=purchases(act), rev=purchaseValue(av);
  const cr=closingRate(act), cpp=costPerPurchase(sp,act), a=aov(av,act), r=roas(sp,av);
  return [
    ["SPEND",fmtB(sp)],["IMPRESSIONS",fmtN(i.impressions)],["CLICKS",fmtN(i.clicks)],["REACH",fmtN(i.reach)],
    ["CTR",fmtP(i.ctr)],["CPM",fmtB(i.cpm)],["MESSAGING STARTED",fmtN(msg)],["PURCHASES",fmtN(pur)],
    ["PURCHASES VALUE",fmtB(rev)],["CLOSING RATE",cr!==null?fmtP(cr):"—"],["COST / PURCHASE",cpp!==null?fmtB(cpp):"—"],
    ["AVERAGE ORDER VALUE",a!==null?fmtB(a):"—"],["PURCHASES ROAS",r!==null?r.toFixed(2)+"x":"—"]
  ];
}
/* Merge a list of raw Meta insight rows (e.g. one breakdown group) into a single row fullMetricCells() can render */
function aggregateInsights(list){
  const t={spend:0,impressions:0,clicks:0,reach:0}, actMap={}, avMap={};
  (list||[]).forEach(r=>{
    t.spend+=+r.spend||0; t.impressions+=+r.impressions||0; t.clicks+=+r.clicks||0; t.reach+=+r.reach||0;
    (r.actions||[]).forEach(a=>{ actMap[a.action_type]=(actMap[a.action_type]||0)+(parseFloat(a.value)||0); });
    (r.action_values||[]).forEach(a=>{ avMap[a.action_type]=(avMap[a.action_type]||0)+(parseFloat(a.value)||0); });
  });
  t.ctr = t.impressions>0? t.clicks/t.impressions*100 : 0;
  t.cpm = t.impressions>0? t.spend/t.impressions*1000 : 0;
  t.actions=Object.entries(actMap).map(([action_type,value])=>({action_type,value:String(value)}));
  t.action_values=Object.entries(avMap).map(([action_type,value])=>({action_type,value:String(value)}));
  return t;
}

function signal(ad, avg){
  const ctr=parseFloat(ad.ctr)||0, c=ad._cpa;
  if(avg.ctr<=0) return "🟡";
  const cpaOK = c===null || avg.cpa===null;
  if(ctr>avg.ctr && (cpaOK || c<avg.cpa*1.2)) return "🟢";

}

async function askAI(system, user, schema=null){
  if(!S.aiKey) throw new Error("ยังไม่ได้ใส่ Anthropic API Key — ตั้งค่าได้ที่หน้า 🔑 Token (ส่วน AI)");
  const body={model:"claude-sonnet-4-6",max_tokens:3000,system,messages:[{role:"user",content:user}]};
  if(schema) body.messages[0].content += "\n\nตอบกลับเป็น JSON เท่านั้น (ไม่มี markdown, ไม่มีข้อความอื่น) ตาม schema นี้: "+JSON.stringify(schema);
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "Content-Type":"application/json","x-api-key":S.aiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"
  },body:JSON.stringify(body)});
  const j=await r.json();
  if(j.error) throw new Error("AI: "+(j.error.message||"error"));
  const text=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  if(schema){ try{ return JSON.parse(text.replace(/```json|```/g,"").trim()); }catch(e){ throw new Error("AI ตอบกลับไม่ใช่ JSON ที่ถูกต้อง"); } }
  return text;
}

function wizSave(from,to){
  if(from===1){ WZ.camp={name:$("wName").value.trim(),objective:$("wObj").value,budgetType:$("wBT").value,budget:+$("wBud").value,bid:$("wBid").value,bidAmt:+$("wBidAmt").value||0};

    if(!WZ.camp.name) return toast("กรุณาตั้งชื่อแคมเปญ","warn"); if(!(WZ.camp.budget>0)) return toast("กรุณาใส่งบ","warn"); }
  if(from===2){ WZ.tgt={...WZ.tgt,country:$("wCty").value,ageMin:+$("wA1").value,ageMax:+$("wA2").value,gender:$("wGen").value,optGoal:$("wOG").value,msgDest:$("wMsgDest")?$("wMsgDest").value:WZ.tgt.msgDest,start:$("wStart").value,end:$("wEnd").value};
    if(WZ.tgt.optGoal==="CONVERSATIONS") WZ.cr.cta=WZ.tgt.msgDest==="WHATSAPP"?"WHATSAPP_MESSAGE":"MESSAGE_PAGE"; }
  if(from===3){ WZ.cr={...WZ.cr,pageId:$("wPage").value,primary:$("wPri").value,headline:$("wHead").value,desc:$("wDesc").value,link:$("wLink").value,cta:$("wCTA").value};
    if(!WZ.cr.pageId) return toast("กรุณาเลือก Facebook Page","warn");
    if(!WZ.cr.imgHash) return toast("กรุณาอัปโหลดรูปโฆษณา","warn");
    if(!WZ.cr.link&&WZ.tgt.optGoal!=="CONVERSATIONS") return toast("กรุณาใส่ Link URL (ยกเว้นเลือก Performance Goal เป็น \"ข้อความ\" ที่ไม่บังคับ)","warn"); }
  WZ.step=to; renderWizard();
}

async function uploadAdImage(inp){
  const f=inp.files[0]; if(!f) return;
  $("imgStat").innerHTML='<span class="spin"></span> กำลังอัปโหลด...';
  try{ const fd=new FormData(); fd.append("filename",f);
    const j=await mPOSTForm(`/${S.act}/adimages`,fd);
    const img=j.images&&j.images[Object.keys(j.images)[0]];
    WZ.cr.imgHash=img.hash; WZ.cr.imgName=f.name;
    $("imgStat").innerHTML=`<span class="tag">✓ ${esc(f.name)} (hash: ${esc(img.hash.slice(0,14))}…)</span>`;
    toast("✅ อัปโหลดรูปเข้าบัญชีโฆษณาสำเร็จ","ok");
  }catch(e){ $("imgStat").innerHTML='<span class="muted">❌ '+esc(e.message)+'</span>'; }
}
function createFullCampaign(){
  confirmAction("สร้างแคมเปญจริงบน Meta",
    `จะสร้าง <strong>Campaign + Ad Set + Creative + Ad</strong> ในบัญชี <strong>${esc(S.act)}</strong><br>
     ชื่อ: <strong>${esc(WZ.camp.name)}</strong> • งบ ${fmtB(WZ.camp.budget)}/${WZ.camp.budgetType==="daily"?"วัน":"ตลอด"}<br>
     ทุกอย่างจะอยู่ในสถานะ <strong>PAUSED</strong> — ยังไม่เริ่มใช้เงินจนกว่าคุณจะเปิดเอง`,
    async ()=>{
      const budSatang=Math.round(WZ.camp.budget*100);
      const cBody={name:WZ.camp.name,objective:WZ.camp.objective,status:"PAUSED",
        special_ad_categories:JSON.stringify(["NONE"]),is_adset_budget_sharing_enabled:false};
      const camp=await mPOST(`/${S.act}/campaigns`,cBody);
      const targeting={geo_locations:{countries:[WZ.tgt.country]},age_min:WZ.tgt.ageMin,age_max:WZ.tgt.ageMax,
        targeting_automation:{advantage_audience:0}};
      if(WZ.tgt.gender!=="all") targeting.genders=[+WZ.tgt.gender];
      if(WZ.tgt.interests.length) targeting.flexible_spec=[{interests:WZ.tgt.interests.map(i=>({id:i.id,name:i.name}))}];
      const asBody={name:WZ.camp.name+" — AdSet",campaign_id:camp.id,billing_event:"IMPRESSIONS",
        optimization_goal:WZ.tgt.optGoal,status:"PAUSED",targeting:JSON.stringify(targeting)};
      if(WZ.camp.budgetType==="daily") asBody.daily_budget=budSatang; else asBody.lifetime_budget=budSatang;
      asBody.bid_strategy=WZ.camp.bid;
      if(WZ.camp.bid==="LOWEST_COST_WITH_BID_CAP") asBody.bid_amount=Math.round(WZ.camp.bidAmt*100);
      if(WZ.tgt.start) asBody.start_time=new Date(WZ.tgt.start).toISOString();
      if(WZ.tgt.end) asBody.end_time=new Date(WZ.tgt.end).toISOString();
      if(WZ.camp.budgetType==="lifetime"&&!WZ.tgt.end) throw new Error("Lifetime budget ต้องกำหนดวันสิ้นสุด");
      /* ★ โฆษณาแบบ "ข้อความ" (CONVERSATIONS) ต้องมี destination_type + promoted_object.page_id ที่ระดับ Ad Set
         ไม่งั้น Meta จะไม่รู้ปลายทาง แล้วจะเซ็ต Conversion location เป็น "Website" ให้เองเงียบๆ */
      if(WZ.tgt.optGoal==="CONVERSATIONS"){
        if(!WZ.cr.pageId) throw new Error("เลือก Facebook Page ก่อน (จำเป็นสำหรับโฆษณาแบบข้อความ)");
        asBody.destination_type=WZ.tgt.msgDest||"ANY";
        asBody.promoted_object=JSON.stringify({page_id:WZ.cr.pageId});
      }
      const adset=await mPOST(`/${S.act}/adsets`,asBody);
      const msgCta=WZ.tgt.optGoal==="CONVERSATIONS"?
        (WZ.tgt.msgDest==="WHATSAPP"?{type:"WHATSAPP_MESSAGE",value:{app_destination:"WHATSAPP"}}:{type:"MESSAGE_PAGE",value:{app_destination:"MESSENGER"}})
        :{type:WZ.cr.cta,value:{link:WZ.cr.link}};
      const creative=await createCreativeSmart({name:WZ.camp.name+" — Creative",
        object_story_spec:JSON.stringify({page_id:WZ.cr.pageId,link_data:{image_hash:WZ.cr.imgHash,link:WZ.cr.link||"https://facebook.com/"+WZ.cr.pageId,
          message:WZ.cr.primary,name:WZ.cr.headline,description:WZ.cr.desc,call_to_action:msgCta}})});
      await mPOST(`/${S.act}/ads`,{name:WZ.camp.name+" — Ad",adset_id:adset.id,creative:JSON.stringify({creative_id:creative.id}),status:"PAUSED"});
      toast("🎉 สร้างแคมเปญครบชุดสำเร็จ! (Campaign/AdSet/Ad = PAUSED)","ok",7000);
      WZ.step=1; WZ.camp.name=""; S.cache={}; renderWizard(); mgrTab("c");
    });
}

function applySuggest(s){
  const g=JSON.parse(s);
  WZ.camp.objective=g.objective||WZ.camp.objective; WZ.camp.budget=g.dailyBudget||WZ.camp.budget; WZ.camp.bid=g.bidStrategy||WZ.camp.bid;
  WZ.tgt.ageMin=g.age_min||WZ.tgt.ageMin; WZ.tgt.ageMax=g.age_max||WZ.tgt.ageMax; WZ.tgt.gender=String(g.gender||"all"); WZ.tgt.optGoal=g.optimizationGoal||WZ.tgt.optGoal;
  WZ.step=1; renderWizard(); toast("✅ นำการตั้งค่า AI ไปใส่ใน Wizard แล้ว (interests ให้ค้นหาเลือกเองในขั้นตอน 2)","ok",6000);
}

          return `<tr><td>${esc(c.name)}</td><td><span class="status ${c.effective_status==="ACTIVE"?"ACTIVE":(c.effective_status==="PAUSED"?"PAUSED":"other")}">${esc(c.effective_status)}</span></td>
          <td class="num small">${bud==="—(ที่ AdSet)"?bud:"฿"+fmtN(parseFloat(bud))+(c.daily_budget?"/วัน":"")}</td>
          <td><div class="row" style="gap:4px">
            ${c.effective_status==="ACTIVE"?`<button class="btn sm" onclick="objStatus('${c.id}','PAUSED','${esc(c.name).replace(/'/g,"\\'")}','แคมเปญ')">⏸</button>`:`<button class="btn sm green" onclick="objStatus('${c.id}','ACTIVE','${esc(c.name).replace(/'/g,"\\'")}','แคมเปญ')">▶</button>`}
            <button class="btn sm" onclick="editBudget('${c.id}','${esc(c.name).replace(/'/g,"\\'")}',${c.daily_budget?+c.daily_budget/100:0},${!!c.daily_budget})">฿</button>
            <button class="btn sm" onclick="dupObj('${c.id}','${esc(c.name).replace(/'/g,"\\'")}','แคมเปญ')">⧉</button>
          </div></td></tr>`;}).join("")+`</tbody></table></div>`;
    } else {
      const adsets=await mGETAll(`/${S.act}/adsets`,{fields:"id,name,status,effective_status,daily_budget,lifetime_budget,campaign{name}"},"adsetMeta");
      box.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Ad Set</th><th>สถานะ</th><th class="num">งบ</th><th>Actions</th></tr></thead><tbody>`+
        adsets.map(a=>`<tr><td>${esc(a.name)}<div class="muted small">${esc(a.campaign?a.campaign.name:"")}</div></td>
          <td><span class="status ${a.effective_status==="ACTIVE"?"ACTIVE":(a.effective_status==="PAUSED"?"PAUSED":"other")}">${esc(a.effective_status)}</span></td>
          <td class="num small">${a.daily_budget?"฿"+fmtN(+a.daily_budget/100)+"/วัน":(a.lifetime_budget?"฿"+fmtN(+a.lifetime_budget/100):"—")}</td>
          <td><div class="row" style="gap:4px">
            ${a.effective_status==="ACTIVE"?`<button class="btn sm" onclick="objStatus('${a.id}','PAUSED','${esc(a.name).replace(/'/g,"\\'")}','Ad Set')">⏸</button>`:`<button class="btn sm green" onclick="objStatus('${a.id}','ACTIVE','${esc(a.name).replace(/'/g,"\\'")}','Ad Set')">▶</button>`}
            <button class="btn sm" onclick="editBudget('${a.id}','${esc(a.name).replace(/'/g,"\\'")}',${a.daily_budget?+a.daily_budget/100:0},${!!a.daily_budget})">฿</button>
          </div></td></tr>`).join("")+`</tbody></table></div>`;
    }
  }catch(e){ box.innerHTML='<div class="muted small">❌ '+esc(e.message)+'</div>'; }
}
function objStatus(id,st,name,kind){
  confirmAction((st==="PAUSED"?"ปิด":"เปิด")+kind,
    `${kind}: <strong>${esc(name)}</strong><br>สถานะใหม่: <strong>${st}</strong><br><br>มีผลกับโฆษณาจริงทันที`,
    async ()=>{ await mPOST("/"+id,{status:st}); toast("✅ สำเร็จ","ok"); S.cache={}; mgrTab($("tabC").classList.contains("active")?"c":"a"); });
}
function editBudget(id,name,cur,isDaily){
  openModal(`<h3>💰 ปรับงบ — ${esc(name)}</h3>
    <label>งบใหม่ (บาท${isDaily?"/วัน":" รวม"})</label><input id="nbud" type="number" value="${cur||100}">
    <div class="muted small mt">งบปัจจุบัน: ${cur?fmtB(cur):"ตั้งที่ระดับอื่น"} • ระบบส่งเป็นสตางค์ (×100) ให้อัตโนมัติ</div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">ยกเลิก</button>
    <button class="btn primary" onclick="doBudget('${id}','${esc(name).replace(/'/g,"\\'")}',${isDaily})">ต่อไป</button></div>`);
}
function doBudget(id,name,isDaily){
  const v=+$("nbud").value; if(!(v>0)) return toast("งบไม่ถูกต้อง","warn");
  closeModal();
  confirmAction("ยืนยันปรับงบ",`<strong>${esc(name)}</strong><br>งบใหม่: <strong>${fmtB(v)}${isDaily?"/วัน":""}</strong>`,
    async ()=>{ const body={}; body[isDaily?"daily_budget":"lifetime_budget"]=Math.round(v*100);
      await mPOST("/"+id,body); toast("✅ ปรับงบสำเร็จ","ok"); S.cache={}; mgrTab($("tabC").classList.contains("active")?"c":"a"); });
}
function dupObj(id,name,kind){
  confirmAction("Duplicate "+kind,`จะสร้างสำเนา <strong>${esc(name)}</strong> (รวมโครงสร้างภายใน) สถานะ <strong>PAUSED</strong>`,
    async ()=>{ await mPOST(`/${id}/copies`,{deep_copy:true,status_option:"PAUSED"}); toast("✅ Duplicate สำเร็จ (PAUSED)","ok"); S.cache={}; mgrTab("c"); });
}
</script>
<script>

async function aicGenerate(){

    AIC.copy=copy;
    $("aicOut").innerHTML=`<div class="card"><h3>✨ ผลลัพธ์จาก AI</h3>
      <div class="ai-out"><strong>วิเคราะห์:</strong> ${mdLite(copy.analysis)}\n\n<strong>Headline:</strong> ${esc(copy.headline)}\n<strong>Body:</strong> ${esc(copy.body)}\n<strong>CTA:</strong> ${esc(copy.cta)}\n<strong>Image Prompt (สำหรับไปสร้างรูป):</strong> <span class="muted">${esc(copy.imagePrompt)}</span></div>
      <div class="row mt">
        <button class="btn green" onclick="aicSaveDraft()">💾 บันทึก Draft</button>
        <button class="btn primary" onclick="aicCreateReal()">🚀 สร้างเป็นโฆษณาจริง (PAUSED) ใน Ad Set เดิม</button>
      </div></div>`;

}
function aicSaveDraft(){

    return toast("ชิ้นงานต้นแบบไม่มีข้อมูล creative พอ (page/link/รูป) — แนะนำบันทึกเป็น Draft แล้วสร้างผ่าน Wizard แทน","warn",7000);

    `Ad Set เดิมของ: <strong>${esc(ad.name)}</strong><br>Headline ใหม่: <strong>${esc(c.headline)}</strong><br>สถานะ: <strong>PAUSED</strong> (รูปใช้รูปเดิมของชิ้นงานต้นแบบ)`,
    async ()=>{
      const link_data={link:ld.link,message:c.body,name:c.headline,call_to_action:{type:CTAS.includes(c.cta)?c.cta:"LEARN_MORE",value:{link:ld.link}}};
      if(ld.image_hash) link_data.image_hash=ld.image_hash; else link_data.picture=thumbOf(ad);
      const cr=await createCreativeSmart({name:ad.name+" — AI v2",
        object_story_spec:JSON.stringify({page_id:oss.page_id,link_data})});
      await mPOST(`/${S.act}/ads`,{name:ad.name+" — AI v2",adset_id:ad.adset_id,creative:JSON.stringify({creative_id:cr.id}),status:"PAUSED"});
      aicSaveDraft(); toast("🎉 สร้างโฆษณา AI v2 สำเร็จ (PAUSED)","ok",7000); S.cache={};
    });
}
PAGES.drafts = async function(){
  $("page").innerHTML=`<div class="card tablewrap"><h3>📝 AI DRAFTS — ประวัติชิ้นงานที่ AI สร้าง</h3>
    ${S.drafts.length? `<table><thead><tr><th>เวลา</th><th>ต้นแบบ</th><th>Headline</th><th>Body</th><th>CTA</th><th></th></tr></thead><tbody>`+
      S.drafts.map((d,i)=>`<tr><td class="small muted">${new Date(d.at).toLocaleString("th-TH")}</td><td>${esc(d.adName)}</td>
        <td><strong>${esc(d.headline)}</strong></td><td class="small">${esc((d.body||"").slice(0,90))}${(d.body||"").length>90?"…":""}</td>
        <td><span class="tag">${esc(d.cta)}</span></td>
        <td><button class="btn sm danger" onclick="S.drafts.splice(${i},1);LS.set('drafts',S.drafts);PAGES.drafts()">ลบ</button></td></tr>`).join("")+"</tbody></table>"
      : '<div class="empty">ยังไม่มี Draft — ไปที่ 🤖 AI Ad Creator เพื่อสร้าง</div>'}</div>`;
};

/* =====================================================================
   6) AI RECOMMENDATIONS
   ===================================================================== */
PAGES.airec = async function(){
  $("page").innerHTML=`<div class="row spread mb">${presetSeg("PAGES.airec")}<button class="btn primary" onclick="runAirec()">💡 วิเคราะห์ด้วย AI</button></div>
    <div class="card"><h3>💡 AI แนะนำการปรับปรุงโฆษณา</h3><div id="recOut"><div class="empty">กดปุ่ม "วิเคราะห์ด้วย AI" — ระบบจะส่งข้อมูลแคมเปญ+ชิ้นงานทั้งหมดในช่วงเวลาที่เลือกให้ AI วิเคราะห์และแนะนำเป็นภาษาไทย</div></div></div>`;
};
async function runAirec(){
  $("recOut").innerHTML='<div class="loadbox"><span class="spin"></span> กำลังดึงข้อมูล + วิเคราะห์...</div>';
  try{
    const range=presetRange(S.preset);
    const [acc,camps,ads]=await Promise.all([accountInsights(range,{},"acc_"+S.preset),levelInsights("campaign",range,"camp_"+S.preset),levelInsights("ad",range,"adIns_"+S.preset)]);
    const brief={period:range,account:{spend:acc.spend,impressions:acc.impressions,clicks:acc.clicks,ctr:acc.ctr,cpm:acc.cpm,purchases:purchases(acc.actions),messages:messages(acc.actions)},
      campaigns:camps.map(c=>({name:c.campaign_name,spend:+c.spend,ctr:+c.ctr,clicks:+c.clicks,cpa:cpa(+c.spend,c.actions)})),

      `วิเคราะห์ข้อมูลบัญชีโฆษณานี้ ชี้ปัญหา จัดอันดับสิ่งที่ควรทำก่อน-หลัง และแนะนำ action ที่ทำได้จริง:\n${JSON.stringify(brief)}`);
    $("recOut").innerHTML=`<div class="ai-out">${mdLite(out)}</div>`;
  }catch(e){ $("recOut").innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>'; }
}

/* =====================================================================
   7) A/B TESTING
   ===================================================================== */
PAGES.abtest = async function(){
  $("page").innerHTML=`<div class="card mb"><h3>⚔️ A/B TESTING — เปรียบเทียบ 2 ชิ้นงาน/แคมเปญ</h3>
    <div class="grid g3">
      <div><label>ระดับ</label><select id="abLvl"><option value="ad">Ads</option><option value="campaign">Campaigns</option></select></div>
      <div><label>ตัวเลือก A</label><select id="abA"></select></div>
      <div><label>ตัวเลือก B</label><select id="abB"></select></div>
    </div>
    <div class="row mt"><button class="btn blue" onclick="abLoad()">โหลดรายการ</button><button class="btn primary" onclick="abRun()">⚔️ เปรียบเทียบ</button></div></div>
    <div id="abOut"></div>`;
  abLoad();
};
async function abLoad(){
  try{ const range=presetRange(S.preset), lvl=$("abLvl").value;
    window._abIns=await levelInsights(lvl,range,"ab_"+lvl+"_"+S.preset);
    const nk=lvl==="ad"?"ad_name":"campaign_name";
    const opts=window._abIns.map((i,x)=>`<option value="${x}">${esc(i[nk])} — ${fmtB(i.spend)}</option>`).join("");
    $("abA").innerHTML=opts; $("abB").innerHTML=opts; if(window._abIns[1]) $("abB").value=1;
  }catch(e){ toast("❌ "+esc(e.message),"err"); }
}
async function abRun(){
  const A=window._abIns[+$("abA").value], B=window._abIns[+$("abB").value];
  if(!A||!B) return toast("เลือก A และ B ก่อน","warn");
  const lvl=$("abLvl").value, nk=lvl==="ad"?"ad_name":"campaign_name";
  const m=i=>({spend:+i.spend||0,impr:+i.impressions||0,clicks:+i.clicks||0,reach:+i.reach||0,ctr:+i.ctr||0,cpm:+i.cpm||0,
    pur:purchases(i.actions),msg:messages(i.actions),rev:purchaseValue(i.action_values),
    close:closingRate(i.actions),cpp:costPerPurchase(+i.spend||0,i.actions),aov:aov(i.action_values,i.actions),roas:roas(+i.spend||0,i.action_values),
    cpa:cpa(+i.spend,i.actions)});
  const a=m(A),b=m(B);
  const score=x=>(x.ctr*2)+(x.cpa?1000/x.cpa:0)+(x.pur*5)+(x.msg*2);
  const winner=score(a)>=score(b)?"A":"B";
  const row=(l,va,vb,fmt=fmtN,inv=false)=>{const wa=inv?va<vb:va>vb;return `<tr><td>${l}</td><td class="num ${wa?"":"muted"}">${wa?"🏆 ":""}${fmt(va)}</td><td class="num ${!wa?"":"muted"}">${!wa?"🏆 ":""}${fmt(vb)}</td></tr>`;};
  $("abOut").innerHTML=`<div class="card tablewrap"><h3>ผลเปรียบเทียบ — Winner: <span style="color:var(--accent)">${winner==="A"?esc(A[nk]):esc(B[nk])}</span> 🏆</h3>
    <table><thead><tr><th>Metric</th><th class="num">A: ${esc(A[nk])}</th><th class="num">B: ${esc(B[nk])}</th></tr></thead><tbody>
    ${row("Spend",a.spend,b.spend,fmtB,true)}${row("Impressions",a.impr,b.impr)}${row("Clicks",a.clicks,b.clicks)}${row("Reach",a.reach,b.reach)}
    ${row("CTR",a.ctr,b.ctr,fmtP)}${row("CPM",a.cpm,b.cpm,fmtB,true)}${row("Messaging Started",a.msg,b.msg)}
    ${row("Purchases",a.pur,b.pur)}${row("Purchases Value",a.rev,b.rev,fmtB)}
    ${row("Closing Rate",a.close===null?-1:a.close,b.close===null?-1:b.close,v=>v<0?"—":fmtP(v))}
    ${row("CPA",a.cpa||1e12,b.cpa||1e12,v=>v>=1e12?"—":fmtB(v),true)}
    ${row("Cost/Purchase",a.cpp===null?1e12:a.cpp,b.cpp===null?1e12:b.cpp,v=>v>=1e12?"—":fmtB(v),true)}
    ${row("AOV",a.aov===null?-1:a.aov,b.aov===null?-1:b.aov,v=>v<0?"—":fmtB(v))}
    ${row("ROAS",a.roas===null?-1:a.roas,b.roas===null?-1:b.roas,v=>v<0?"—":v.toFixed(2)+"x")}
    </tbody></table>
    <div class="row mt"><button class="btn primary" onclick="abAI('${esc(A[nk]).replace(/'/g,"\\'")}','${esc(B[nk]).replace(/'/g,"\\'")}',${JSON.stringify(a).replace(/"/g,"&quot;")},${JSON.stringify(b).replace(/"/g,"&quot;")})">🤖 ให้ AI วิเคราะห์</button>
    <button class="btn" onclick="window.print()">🖨️ พิมพ์/บันทึก PDF</button></div>
    <div id="abAiOut" class="mt"></div></div>`;
  S.abHistory.unshift({at:Date.now(),a:A[nk],b:B[nk],winner:winner==="A"?A[nk]:B[nk]}); S.abHistory=S.abHistory.slice(0,30); LS.set("abHistory",S.abHistory);
}
async function abAI(an,bn,a,b){
  $("abAiOut").innerHTML='<span class="spin"></span> AI กำลังวิเคราะห์...';
  try{ const out=await askAI("คุณเป็นผู้เชี่ยวชาญ Meta Ads ตอบภาษาไทยกระชับ",
      `เปรียบเทียบ A/B:\nA (${an}): ${JSON.stringify(a)}\nB (${bn}): ${JSON.stringify(b)}\nใครชนะเพราะอะไร และควรทำอะไรต่อ`);
    $("abAiOut").innerHTML=`<div class="ai-out">${mdLite(out)}</div>`;
  }catch(e){ $("abAiOut").innerHTML='<span class="muted">❌ '+esc(e.message)+'</span>'; }
}
</script>
<script>

   8) SALES FUNNEL

function addRule(){
  const r={name:$("rName").value.trim()||"กฎใหม่",metric:$("rMetric").value,op:$("rOp").value,val:+$("rVal").value,preset:$("rPreset").value,mode:$("rMode").value,enabled:true};
  S.rules.push(r); LS.set("rules",S.rules); renderRules(); toast("✅ เพิ่มกฎแล้ว","ok");
}
async function runRule(i, silent=false){
  const r=S.rules[i]; if(!r) return;
  try{
    const range=presetRange(r.preset);
    const ins=await levelInsights("ad",range);
    const matched=ins.filter(a=>{
      const v=r.metric==="cpa"?cpa(+a.spend,a.actions):(r.metric==="ctr"?+a.ctr:+a.spend);
      if(v===null||v===undefined) return false;
      return r.op===">"? v>r.val : v<r.val;
    });
    S.ruleLogs.unshift({at:Date.now(),rule:r.name,checked:ins.length,matched:matched.length});
    S.ruleLogs=S.ruleLogs.slice(0,50); LS.set("ruleLogs",S.ruleLogs); renderRules();
    if(matched.length){
      notify(`⛔ กฎ "${r.name}"`, `พบ ${matched.length} ชิ้นงานเข้าเงื่อนไข ${METRICS[r.metric]} ${r.op} ${r.val}`);
      if(!silent||r.mode==="pause"){
        openModal(`<h3>⛔ กฎ "${esc(r.name)}" พบ ${matched.length} ชิ้นงาน</h3>
          <div class="small" style="max-height:300px;overflow-y:auto">${matched.map(m=>`<div style="padding:5px 0;border-bottom:1px solid rgba(25,20,16,.09)">${esc(m.ad_name)} — Spend ${fmtB(m.spend)} • CTR ${fmtP(m.ctr)} • CPA ${cpa(+m.spend,m.actions)?fmtB(cpa(+m.spend,m.actions)):"—"}</div>`).join("")}</div>
          <div class="row mt" style="justify-content:flex-end">
            <button class="btn" onclick="closeModal()">ปิด</button>
            ${r.mode==="pause"?`<button class="btn danger" onclick='pauseMatched(${JSON.stringify(matched.map(m=>({id:m.ad_id,name:m.ad_name}))).replace(/'/g,"&#39;")})'>⏸ ปิดทั้งหมด ${matched.length} ชิ้น</button>`:""}
          </div>`);
      }
    } else if(!silent) toast(`✅ กฎ "${esc(r.name)}" — ไม่พบชิ้นงานเข้าเงื่อนไข`,"ok");
  }catch(e){ if(!silent) toast("❌ "+esc(e.message),"err"); }
}
function pauseMatched(list){
  closeModal();
  confirmAction("ปิดโฆษณาตามกฎ", `จะปิดโฆษณา <strong>${list.length} ชิ้น</strong>:<br>${list.map(x=>"• "+esc(x.name)).join("<br>")}`,
    async ()=>{ for(const x of list){ await mPOST("/"+x.id,{status:"PAUSED"}); }
      toast(`✅ ปิดแล้ว ${list.length} ชิ้น`,"ok"); S.cache={}; });
}
async function sendLine(text){
  if(!S.lineUrl||!S.lineKey) throw new Error("ยังไม่ได้ตั้งค่า LINE Worker URL/Secret ที่หน้า 🔑 Token");
  const r=await fetch(S.lineUrl+"/notify",{method:"POST",headers:{"Content-Type":"application/json","X-Auth":S.lineKey},body:JSON.stringify({text})});
  if(!r.ok) throw new Error("LINE Worker ตอบ "+r.status+" — เช็ค URL/Secret");
  return r.json();
}
function notify(title,body){
  toast(`<strong>${esc(title)}</strong><br>${esc(body)}`,"warn",8000);
  if("Notification" in window){
    if(Notification.permission==="granted") new Notification(title,{body});
    else if(Notification.permission!=="denied") Notification.requestPermission();
  }
  if(S.lineUrl&&S.lineKey) sendLine(title+"\n"+body).catch(()=>{});
}

async function runSchedCheck(silent){

/* Cron manager — ทุก 60 วิ */
setInterval(()=>{
  if(!S.token||!S.act) return;
  const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Bangkok"}));
  const key=now.getHours()+":"+now.getMinutes();

async function genWeekly(silent){
  try{
    if(!silent) toast("กำลังสร้างรายงาน...","info");
    const t=bkkToday(); const dow=(t.getDay()+6)%7; /* days since Monday */
    const lastMon=addD(t,-dow-7), lastSun=addD(lastMon,6);
    const range={since:ymd(lastMon),until:ymd(lastSun)};
    const [acc,camps]=await Promise.all([accountInsights(range),levelInsights("campaign",range)]);
    let ai=null;
    if(S.aiKey){ try{ ai=await askAI("สรุปรายงานโฆษณารายสัปดาห์เป็นภาษาไทย กระชับ อ่านง่าย",
      `สัปดาห์ ${range.since} ถึง ${range.until}\nAccount: ${JSON.stringify({spend:acc.spend,impressions:acc.impressions,clicks:acc.clicks,ctr:acc.ctr})}\nCampaigns: ${JSON.stringify(camps.map(c=>({name:c.campaign_name,spend:+c.spend,ctr:+c.ctr,results:purchases(c.actions)+messages(c.actions)})))}\nสรุปภาพรวม + จุดเด่น + จุดต้องแก้`);}catch(e){} }
    S.reports.unshift({...range,raw:acc,spend:+acc.spend||0,impressions:+acc.impressions||0,clicks:+acc.clicks||0,
      results:purchases(acc.actions)+messages(acc.actions),ai,at:Date.now()});
    S.reports=S.reports.slice(0,20); LS.set("reports",S.reports);
    notify("📅 รายงานสัปดาห์พร้อมแล้ว",`${range.since} → ${range.until}`);
    if(S.page==="weekly") $("wkList").innerHTML=renderWeeklyList();
  }catch(e){ if(!silent) toast("❌ "+esc(e.message),"err"); }
}

let FAA={items:[],sel:new Set(),loading:false,token:""};
function faaStatusLabel(s){
  const m={1:"ใช้งานได้",2:"ปิดใช้งาน",3:"ค้างชำระ",7:"รอตรวจสอบ",8:"รอตัดยอด",9:"ผ่อนผัน",100:"รอปิด",101:"ปิดแล้ว"};
  return m[s]||("รหัส "+s);
}
async function fetchAdAccountsList(){
  const typed=$("tkVal")?$("tkVal").value.trim():"";
  const tok=typed||S.token;
  if(!tok) return toast("ใส่ Token ในช่อง META ACCESS TOKEN ด้านล่างก่อน","warn");
  FAA.token=tok; FAA.loading=true; renderFAABox();
  try{
    const u=new URL(API+"/me/adaccounts");
    u.searchParams.set("access_token",tok);
    u.searchParams.set("fields","id,account_id,name,account_status,currency,business_name");
    u.searchParams.set("limit","200");
    let data=[], r=await fetch(u), j=await r.json();
    if(j.error) throw new Error(parseMetaError(j));
    data=data.concat(j.data||[]);
    let n=1;
    while(j.paging && j.paging.next && n<10){ const r2=await fetch(j.paging.next); j=await r2.json(); if(j.error) throw new Error(parseMetaError(j)); data=data.concat(j.data||[]); n++; }
    FAA.items=data.map(a=>({...a, act:"act_"+String(a.account_id||a.id).replace("act_","")}));
    FAA.sel=new Set(FAA.items.map(a=>a.act));
    tkLog("ดึงรายชื่อบัญชีโฆษณา ("+FAA.items.length+" บัญชี)");
    if(!FAA.items.length) toast("Token นี้ยังไม่พบบัญชีโฆษณาที่เข้าถึงได้","warn",6000);
  }catch(e){ toast("❌ ดึงรายชื่อบัญชีไม่สำเร็จ: "+esc(e.message),"err",7000); FAA.items=[]; }
  FAA.loading=false; renderFAABox();
}
function toggleFAASel(act){ if(FAA.sel.has(act)) FAA.sel.delete(act); else FAA.sel.add(act); renderFAABox(); }
function renderFAABox(){
  const el=$("faaBox"); if(!el) return;
  if(FAA.loading){ el.innerHTML='<span class="spin"></span> กำลังดึงรายชื่อบัญชี...'; return; }
  if(!FAA.items.length){ el.innerHTML='<div class="muted small">ยังไม่ได้ดึงรายชื่อ — วาง Token ในช่อง META ACCESS TOKEN ด้านล่างก่อน (ไม่ต้องกด บันทึก ก็ได้) แล้วกดปุ่มด้านบน</div>'; return; }
  el.innerHTML=`
    <div class="muted small mb">พบ ${FAA.items.length} บัญชี — ติ๊กเลือกบัญชีที่ต้องการเพิ่มเป็นโปรไฟล์ (ตั้งชื่อให้อัตโนมัติตามชื่อบัญชีจริง)</div>
    <div style="max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:10px">
      ${FAA.items.map(a=>`
        <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer">
          <input type="checkbox" ${FAA.sel.has(a.act)?"checked":""} onchange="toggleFAASel('${a.act}')">
          <span style="flex:1;min-width:0">
            <span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600">${esc(a.name||a.act)}</span>
            <span class="muted small">${esc(a.act)} ${a.business_name?"• "+esc(a.business_name):""} ${a.currency?"• "+esc(a.currency):""}</span>
          </span>
          <span class="tag ${a.account_status===1?"":"pink"}" style="font-size:11px">${faaStatusLabel(a.account_status)}</span>
        </label>`).join("")}
    </div>
    <div class="row mt">
      <button class="btn primary" onclick="bulkAddSelectedAccounts()">➕ เพิ่มที่เลือกไว้เป็นโปรไฟล์ (${FAA.sel.size})</button>
    </div>`;
}
function bulkAddSelectedAccounts(){
  if(!FAA.sel.size) return toast("ยังไม่ได้ติ๊กเลือกบัญชี","warn");
  let added=0, skipped=0, firstNewId=null;
  FAA.sel.forEach(act=>{
    const a=FAA.items.find(x=>x.act===act); if(!a) return;
    if(S.profiles.some(p=>p.act===act)){ skipped++; return; }
    const id="p_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
    S.profiles.push({id, name:a.name||act, token:FAA.token, act});
    if(!firstNewId) firstNewId=id;
    added++;
  });
  LS.set("profiles",S.profiles);
  if(!S.activeProfileId && firstNewId){ switchProfile(firstNewId); }
  else { renderAccountSwitcher(); if(S.page==="token") PAGES.token(); }
  toast(`💾 เพิ่ม ${added} บัญชีเป็นโปรไฟล์แล้ว${skipped?` (ข้าม ${skipped} บัญชีที่มีอยู่แล้ว)`:""}`,"ok",6000);
}
function tkSave(){
  S.token=$("tkVal").value.trim(); S.act=$("tkAct").value.trim();
  if(S.act && !S.act.startsWith("act_")) S.act="act_"+S.act;
  LS.set("token",S.token); LS.set("act",S.act); tkLog("บันทึก Token/บัญชี"); connBadge();
  toast("💾 บันทึกแล้ว — กดทดสอบเพื่อยืนยัน","ok"); PAGES.token();
}
async function tkTest(){
  $("tkCard").innerHTML='<span class="spin"></span> กำลังทดสอบ...';
  try{
    const me=await mGET("/me",{fields:"id,name"});
    const dbg=await mGET("/debug_token",{input_token:S.token});
    const d=dbg.data||{};
    const exp=d.expires_at? new Date(d.expires_at*1000) : null;
    const daysLeft=exp? Math.round((exp-Date.now())/864e5) : null;
    let acct={name:"—"}; try{ acct=await mGET("/"+S.act,{fields:"name,account_status,currency,amount_spent"});}catch(e){}
    tkLog("ทดสอบ Token สำเร็จ ("+me.name+")");
    $("tkCard").innerHTML=`<div style="line-height:2">
      ✅ <strong>Token ใช้งานได้</strong> — ผู้ใช้: ${esc(me.name)}<br>
      📅 หมดอายุ: ${exp? exp.toLocaleString("th-TH")+` <span class="tag ${daysLeft<7?"pink":""}">${daysLeft<0?"หมดแล้ว!":"เหลือ "+daysLeft+" วัน"}</span>` : '<span class="tag">ไม่หมดอายุ (Never)</span>'}<br>
      🔐 Scopes: ${(d.scopes||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join("")||"—"}<br>
      🏦 บัญชีโฆษณา: ${esc(acct.name)} ${acct.currency?`(${esc(acct.currency)})`:""} • ใช้ไปแล้ว ${acct.amount_spent?fmtB(+acct.amount_spent/100):"—"}</div>`;
    connBadge();
  }catch(e){ tkLog("ทดสอบล้มเหลว"); $("tkCard").innerHTML='<span style="color:var(--danger)">❌ '+esc(e.message)+'</span>'; }
}
function tkRevoke(){
  confirmAction("ลบ Token ออกจากเครื่อง","จะลบ Token และ Ad Account ID ออกจาก localStorage ของเบราว์เซอร์นี้ (ไม่ได้ revoke ที่ฝั่ง Meta — ทำได้ใน Business Settings)",
    async ()=>{ S.token=""; S.act=""; LS.del("token"); LS.del("act"); tkLog("ลบ Token ออกจากเครื่อง"); connBadge(); PAGES.token(); toast("🗑 ลบแล้ว","ok"); });
}

   (ดูบล็อก "Auth" ด้านบน) เพื่อรอให้ผู้ใช้ล็อกอินผ่านก่อนเสมอ — renderTopNav/renderMobileNav/

renderTopNav(); renderMobileNav(); connBadge(); renderAccountSwitcher();

/* วาดรูปโฆษณา 1080×1080 ตามสเปคที่ AI ออกแบบ */
function drawAdImage(d,prod){
  const c=document.createElement("canvas"); c.width=1080; c.height=1080; const x=c.getContext("2d");
  const bg1=d.bg1||"#1C1712", bg2=d.bg2||"#FFC93C", acc=d.accent||"#C81E3A", tc=d.textColor||"#FFFFFF";
  if(d.style==="split"){ x.fillStyle=bg1; x.fillRect(0,0,1080,620); x.fillStyle=bg2; x.fillRect(0,620,1080,460); }
  else if(d.style==="solid"){ x.fillStyle=bg1; x.fillRect(0,0,1080,1080); }
  else { const g=x.createLinearGradient(0,0,1080,1080); g.addColorStop(0,bg1); g.addColorStop(1,bg2); x.fillStyle=g; x.fillRect(0,0,1080,1080); }
  x.globalAlpha=.14; x.fillStyle=acc; x.beginPath(); x.arc(950,120,260,0,7); x.fill(); x.beginPath(); x.arc(90,1000,200,0,7); x.fill(); x.globalAlpha=1;
  if(prod){ const s=Math.min(560/prod.width,560/prod.height), w=prod.width*s, h=prod.height*s;
    x.save(); x.shadowColor="rgba(0,0,0,.45)"; x.shadowBlur=40; x.drawImage(prod,(1080-w)/2,300-(h/2)+240,w,h); x.restore(); }
  const wrap=(txt,font,maxW)=>{ x.font=font; const words=(txt||"").split(/\s+/); let lines=[],cur="";
    words.forEach(w=>{ const t=cur?cur+" "+w:w; if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t; }); if(cur)lines.push(cur); return lines; };
  if(d.badge){ x.font="700 46px 'Noto Sans Thai',sans-serif"; const bw=x.measureText(d.badge).width+70;
    x.fillStyle=acc; x.beginPath(); x.roundRect(70,70,bw,86,43); x.fill();
    x.fillStyle="#0A0A1A"; x.textBaseline="middle"; x.fillText(d.badge,105,115); }
  x.textBaseline="alphabetic"; x.fillStyle=tc;
  let y = prod? 850 : 430;
  wrap(d.bigText,"900 96px 'Noto Sans Thai',sans-serif",940).slice(0,2).forEach(l=>{ x.font="900 96px 'Noto Sans Thai',sans-serif"; x.fillText(l,70,y); y+=112; });
  x.globalAlpha=.92; wrap(d.subText,"500 52px 'Noto Sans Thai',sans-serif",940).slice(0,2).forEach(l=>{ x.font="500 52px 'Noto Sans Thai',sans-serif"; x.fillText(l,70,y); y+=66; }); x.globalAlpha=1;
  if(d.ctaText){ x.font="700 50px 'Noto Sans Thai',sans-serif"; const cw=x.measureText(d.ctaText).width+90;
    x.fillStyle=tc; x.beginPath(); x.roundRect(70,Math.min(y+16,950),cw,96,48); x.fill();
    x.fillStyle=bg1; x.textBaseline="middle"; x.fillText(d.ctaText,115,Math.min(y+16,950)+50); }
  return c.toDataURL("image/png");
}

<script>
/* =====================================================================
   ★ PATCH v3 — 1) คำแนะนำ error แอปโหมดพัฒนา  2) Gen รูปอิงรูปเดิม
   ===================================================================== */
/* 1) override parseMetaError เพิ่มเคสแอปโหมดพัฒนา */
const _origParse = parseMetaError;
parseMetaError = function(j){
  const e=j&&j.error;
  const raw=((e&&e.message)||"")+" "+((e&&e.error_user_msg)||"");
  if(/development|โหมดพัฒนา|must be public|เป็นสาธารณะ/i.test(raw))
    return "แอป Facebook ที่ใช้สร้าง Token ยังอยู่ในโหมดพัฒนา (Development) — Meta ไม่ให้สร้างโฆษณาจากแอปโหมดนี้ • วิธีแก้: ไปที่ developers.facebook.com → เลือกแอปของคุณ → สลับสวิตช์ App Mode ด้านบนจาก Development เป็น Live (อาจต้องกรอก Privacy Policy URL ในหน้า Settings > Basic ก่อน) แล้วลองใหม่ได้ทันที ไม่ต้องสร้าง Token ใหม่";
  return _origParse(j);
};
/* 2) โหลดรูปเดิมแบบข้าม CORS ถ้าได้ */
function bestOrigUrl(ad){
  const c=ad.creative||{}, oss=c.object_story_spec||{}, ld=oss.link_data||{};
  return c.image_url || ld.picture || (oss.video_data&&oss.video_data.image_url) || c.thumbnail_url || null;
}
function loadImageCORS(url){
  return new Promise(res=>{
    if(!url) return res(null);
    const im=new Image(); im.crossOrigin="anonymous";
    const timer=setTimeout(()=>res(null),8000);
    im.onload=()=>{ clearTimeout(timer);
      try{ const t=document.createElement("canvas"); t.width=2;t.height=2;
        t.getContext("2d").drawImage(im,0,0,2,2); t.toDataURL(); res(im); }
      catch(e){ res(null); } };
    im.onerror=async ()=>{ clearTimeout(timer);
      try{ const r=await fetch(url); const b=await r.blob();
        const im2=new Image(); im2.onload=()=>res(im2); im2.onerror=()=>res(null);
        im2.src=URL.createObjectURL(b); }
      catch(e){ res(null); } };
    im.src=url + (url.includes("?")?"&":"?") + "cachebust=" + Date.now();
  });
}
/* 3) drawAdImage รองรับโหมดอิงรูปเดิม (base) */
const _origDraw = drawAdImage;
drawAdImage = function(d, prod, base){
  if(!base) return _origDraw(d, prod);
  const c=document.createElement("canvas"); c.width=1080; c.height=1080; const x=c.getContext("2d");
  const acc=d.accent||"#C81E3A", tc=d.textColor||"#FFFFFF", bg1=d.bg1||"#0B0908";
  /* วางรูปเดิมแบบ cover เต็ม 1080×1080 */
  const s=Math.max(1080/base.width,1080/base.height), w=base.width*s, h=base.height*s;
  x.drawImage(base,(1080-w)/2,(1080-h)/2,w,h);
  /* เงาไล่ระดับล่างเพื่อให้ตัวหนังสืออ่านออก */
  const g=x.createLinearGradient(0,480,0,1080); g.addColorStop(0,"rgba(5,5,15,0)"); g.addColorStop(1,"rgba(5,5,15,.88)");
  x.fillStyle=g; x.fillRect(0,480,1080,600);
  const g2=x.createLinearGradient(0,0,0,240); g2.addColorStop(0,"rgba(5,5,15,.55)"); g2.addColorStop(1,"rgba(5,5,15,0)");
  x.fillStyle=g2; x.fillRect(0,0,1080,240);
  if(prod){ const ps=Math.min(360/prod.width,360/prod.height), pw=prod.width*ps, ph=prod.height*ps;
    x.save(); x.shadowColor="rgba(0,0,0,.5)"; x.shadowBlur=30; x.drawImage(prod,1080-pw-60,250,pw,ph); x.restore(); }
  const wrap=(txt,font,maxW)=>{ x.font=font; const words=(txt||"").split(/\s+/); let lines=[],cur="";
    words.forEach(wd=>{ const t=cur?cur+" "+wd:wd; if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=wd;}else cur=t; }); if(cur)lines.push(cur); return lines; };
  if(d.badge){ x.font="700 44px 'Noto Sans Thai',sans-serif"; const bw=x.measureText(d.badge).width+66;
    x.fillStyle=acc; x.beginPath(); x.roundRect(60,60,bw,82,41); x.fill();
    x.fillStyle="#0A0A1A"; x.textBaseline="middle"; x.fillText(d.badge,93,103); }
  x.textBaseline="alphabetic"; x.fillStyle=tc;
  const bigLines=wrap(d.bigText,"900 88px 'Noto Sans Thai',sans-serif",950).slice(0,2);
  const subLines=wrap(d.subText,"500 48px 'Noto Sans Thai',sans-serif",950).slice(0,2);
  let y=1080-90-(d.ctaText?110:0)-subLines.length*60-(bigLines.length-1)*102;
  bigLines.forEach(l=>{ x.font="900 88px 'Noto Sans Thai',sans-serif";
    x.save(); x.shadowColor="rgba(0,0,0,.6)"; x.shadowBlur=16; x.fillText(l,60,y); x.restore(); y+=102; });
  x.globalAlpha=.95; subLines.forEach(l=>{ x.font="500 48px 'Noto Sans Thai',sans-serif"; x.fillText(l,60,y); y+=60; }); x.globalAlpha=1;
  if(d.ctaText){ x.font="700 46px 'Noto Sans Thai',sans-serif"; const cw=x.measureText(d.ctaText).width+84;
    x.fillStyle=acc; x.beginPath(); x.roundRect(60,y+8,cw,90,45); x.fill();
    x.fillStyle="#0A0A1A"; x.textBaseline="middle"; x.fillText(d.ctaText,102,y+8+46); }
  return c.toDataURL("image/png");
};
/* 4) clRun: โหลดรูปเดิมก่อน แล้วเริ่มด้วยโหมด "อิงรูปเดิม" ถ้าโหลดได้ */

   (Meta บางบัญชีบังคับต้องมี แต่เลิกรับแบบรวม standard_enhancements แล้ว) */
async function createCreativeSmart(body){
  const variants=[
    /* 1) มาตรฐานใหม่: ตั้งรายฟีเจอร์ */
    {creative_features_spec:{

    null,
    /* 3) แบบรวมเดิม (บัญชีเก่าบางบัญชียังต้องใช้) */
    {creative_features_spec:{standard_enhancements:{enroll_status:"OPT_OUT"}}},
    {creative_features_spec:{standard_enhancements:{enroll_status:"OPT_IN"}}}
  ];
  let lastErr=null;
  for(const v of variants){
    try{
      const b={...body};
      if(v) b.degrees_of_freedom_spec=JSON.stringify(v); else delete b.degrees_of_freedom_spec;
      return await mPOST(`/${S.act}/adcreatives`,b);
    }catch(e){
      lastErr=e;
      const m=e.message||"";
      /* error ที่ไม่เกี่ยวกับ degrees_of_freedom → โยนออกทันที ไม่ต้องวนลองต่อ */
      if(!/degrees_of_freedom|หลายปลายทาง|เพิ่มประสิทธิภาพ|enhancement|creative_features|multi.?advertiser|multi.?destination/i.test(m)) throw e;
    }
  }

}

<script>
/* ★ PATCH v5 — จับคู่ objective ↔ optimization goal อัตโนมัติ */
function mapObjective(o){
  const m={TRAFFIC:"OUTCOME_TRAFFIC",LINK_CLICKS:"OUTCOME_TRAFFIC",MESSAGES:"OUTCOME_ENGAGEMENT",
    POST_ENGAGEMENT:"OUTCOME_ENGAGEMENT",PAGE_LIKES:"OUTCOME_ENGAGEMENT",EVENT_RESPONSES:"OUTCOME_ENGAGEMENT",
    VIDEO_VIEWS:"OUTCOME_ENGAGEMENT",CONVERSIONS:"OUTCOME_SALES",CATALOG_SALES:"OUTCOME_SALES",
    STORE_VISITS:"OUTCOME_SALES",PRODUCT_CATALOG_SALES:"OUTCOME_SALES",LEAD_GENERATION:"OUTCOME_LEADS",
    BRAND_AWARENESS:"OUTCOME_AWARENESS",REACH:"OUTCOME_AWARENESS",APP_INSTALLS:"OUTCOME_APP_PROMOTION"};
  return m[o]||o;
}
/* ลำดับเป้าหมายสำรองต่อ objective (เรียงจากตรงสายงานสุด → กลางๆ) */
const GOAL_FALLBACKS={
  OUTCOME_TRAFFIC:["LINK_CLICKS","LANDING_PAGE_VIEWS","REACH","IMPRESSIONS"],
  OUTCOME_ENGAGEMENT:["CONVERSATIONS","POST_ENGAGEMENT","THRUPLAY","LINK_CLICKS","REACH","IMPRESSIONS"],
  OUTCOME_SALES:["OFFSITE_CONVERSIONS","CONVERSATIONS","LINK_CLICKS","LANDING_PAGE_VIEWS","IMPRESSIONS"],
  OUTCOME_LEADS:["LEAD_GENERATION","OFFSITE_CONVERSIONS","CONVERSATIONS","LINK_CLICKS"],
  OUTCOME_AWARENESS:["REACH","IMPRESSIONS","AD_RECALL_LIFT","THRUPLAY"],
  OUTCOME_APP_PROMOTION:["APP_INSTALLS","LINK_CLICKS","OFFSITE_CONVERSIONS"]
};
async function createAdsetSmart(asBody, objective){
  const fb=GOAL_FALLBACKS[mapObjective(objective)]||["LINK_CLICKS","REACH","IMPRESSIONS"];
  const goals=[asBody.optimization_goal,...fb].filter((g,i,a)=>g&&a.indexOf(g)===i);
  let lastErr=null;
  for(let i=0;i<goals.length;i++){
    try{
      const b={...asBody,optimization_goal:goals[i]};
      if(i>0){ b.billing_event="IMPRESSIONS"; /* เป้าหมายสำรอง → บิลแบบ impressions ปลอดภัยสุด */
        if(goals[i]!=="OFFSITE_CONVERSIONS"&&goals[i]!=="LEAD_GENERATION") delete b.promoted_object;
        if(goals[i]!=="CONVERSATIONS") delete b.destination_type; }
      const r=await mPOST(`/${S.act}/adsets`,b);
      if(i>0) toast("ℹ️ เป้าหมายเดิมใช้กับ objective นี้ไม่ได้ — ระบบใช้ "+goals[i]+" แทน","warn",7000);
      return r;
    }catch(e){ lastErr=e;
      const m=e.message||"";
      if(!/optimization|เป้าหมาย|billing|objective|promoted_object|destination/i.test(m)) throw e;
    }
  }
  throw lastErr;
}
</script>

<script>
/* ★ PATCH v7 — askAI ลองซ้ำอัตโนมัติเมื่อ AI Overloaded / Rate limit */
const _origAskAI = askAI;
askAI = async function(system, user, schema=null){
  let lastErr=null;
  for(let i=0;i<4;i++){
    try{ return await _origAskAI(system, user, schema); }
    catch(e){
      lastErr=e;
      const m=(e.message||"");
      if(/overloaded|529|rate.?limit|too many|timeout|network/i.test(m)){
        const wait=(i+1)*3000;
        toast("⏳ AI คนใช้เยอะชั่วคราว — กำลังลองใหม่อัตโนมัติ ("+(i+1)+"/3) รอ "+(wait/1000)+" วิ...","warn",wait);
        await new Promise(r=>setTimeout(r,wait));
      } else throw e;
    }
  }
  throw new Error("AI ยังไม่ว่างหลังลอง 3 ครั้ง — รอสัก 1-2 นาทีแล้วกดใหม่อีกครั้ง (ข้อมูลที่กรอกไว้ยังอยู่ครบ)");
};

function isVideoAd(ad){
  const c=(ad&&ad.creative)||{}, oss=c.object_story_spec||{}, ld=oss.link_data||{};

  return !!c.video_id;                    /* เหลือแค่ video_id เดี่ยวๆ → วิดีโอ */
}

<script>
/* ★ PATCH v11 — ตัวตรวจประเภทรุ่นใหม่ (object_type + asset_feed_spec) + โหมดบังคับเอง */
isVideoAd = function(ad){
  const f=document.getElementById("clForce");
  if(f&&f.value==="image") return false;
  if(f&&f.value==="video") return true;
  const c=(ad&&ad.creative)||{}, oss=c.object_story_spec||{}, ld=oss.link_data||{}, afs=c.asset_feed_spec||{};
  if((afs.images||[]).length) return false;             /* asset feed มีรูป → รูป */
  if((afs.videos||[]).length) return true;              /* asset feed มีวิดีโอ → วิดีโอ */
  if(c.object_type==="VIDEO") return true;              /* Meta ระบุประเภทตรงๆ */
  if(c.object_type&&c.object_type!=="SHARE") return false; /* PHOTO/LINK/STATUS → รูป */
  if(c.image_url||c.image_hash||ld.image_hash||ld.picture) return false;
  if(oss.video_data) return true;
  return !!c.video_id;
};

<script>
/* ★ PATCH v12 — Gen รูปภาพจริงด้วย OpenAI gpt-image-1 (ChatGPT Image) */
function exportBlob(img){
  return new Promise(res=>{ if(!img) return res(null);
    try{ const c=document.createElement("canvas"); c.width=Math.min(img.width,1024); c.height=Math.min(img.height,1024);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>res(b),"image/png"); }catch(e){ res(null); } });
}
async function openaiImage(prompt, baseBlob){
  if(!S.oaiKey) throw new Error("ยังไม่ได้ใส่ OpenAI API Key — ตั้งค่าที่หน้า 🔑 Token (การ์ด OpenAI)");
  const models = baseBlob? ["gpt-image-2","gpt-image-1.5","gpt-image-1"] : ["gpt-image-2","gpt-image-1.5","gpt-image-1","dall-e-3"];
  let lastErr=null;
  for(const model of models){
    try{
      let r;
      if(baseBlob){
        const fd=new FormData(); fd.append("model",model); fd.append("prompt",prompt);
        fd.append("size","1024x1024"); fd.append("image",baseBlob,"base.png");
        if(model==="gpt-image-1"||model==="gpt-image-1.5") fd.append("input_fidelity","high");
        r=await fetch("https://api.openai.com/v1/images/edits",{method:"POST",headers:{Authorization:"Bearer "+S.oaiKey},body:fd});
      } else {
        const body={model,prompt,size:"1024x1024",n:1};
        if(model==="dall-e-3") body.response_format="b64_json";
        r=await fetch("https://api.openai.com/v1/images/generations",{method:"POST",
          headers:{Authorization:"Bearer "+S.oaiKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
      }
      const j=await r.json();
      if(j.error) throw new Error(j.error.message||"OpenAI error");
      const d=j.data&&j.data[0];
      if(d&&d.b64_json){ window._gptModel=model; return "data:image/png;base64,"+d.b64_json; }
      if(d&&d.url){ window._gptModel=model; const rb=await fetch(d.url); const bl=await rb.blob();
        return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(bl);}); }
      throw new Error("OpenAI ไม่ได้ส่งรูปกลับมา");
    }catch(e){ lastErr=e;
      if(!/model|verif|not.?found|access|unsupported/i.test(e.message||"")) throw e; }
  }
  throw lastErr;
}
function gptDefaultPrompt(){
  const head=$("cvHead")?$("cvHead").value:(CL.plan&&CL.plan.headline)||"";

}

      const blob=upFile ? upFile : (useB? await exportBlob(baseImg) : null);
      if(useB&&!blob) toast("⚠️ ส่งรูปเดิมไม่ได้ (CORS) — สร้างใหม่จาก prompt แทน","warn",5000);
      let fp=$("gptPrompt").value.trim();
      if(blob) fp="Using the reference image: keep the SAME product, packaging, and main subject clearly recognizable (same items, same brand look). Improve into a professional ad photo. "+fp;
      const img=await openaiImage(fp, blob);
      if(target==="ig"){ IG.img=img; igShow(); }

        CL.lockedImg=img; CL.lockedBase=false; CL.lockedDesign=CL.plan&&CL.plan.design; CL.lockedFor=CL.src&&CL.src.id;

}

function normProv(s){ return String(s||"").toLowerCase().replace(/province|changwat|metropolis/g,"").replace(/[^a-z]/g,""); }
const PROV_ALIAS={ayutthaya:"phranakhonsiayutthaya",korat:"nakhonratchasima",bangkokmetropolis:"bangkok",krungthepmahanakhon:"bangkok",buriram:"buriram",nongbualamphu:"nongbualamphu"};
function provKey(s){ const k=normProv(s); return PROV_ALIAS[k]||k; }
function renderGeoMap(m){
  const box=$("geoMap"); if(!box) return;
  const rows=window._geo||[];
  const byKey={}; rows.forEach(r=>{ byKey[provKey(r.region)]=r; });
  const val=r=>m===0?r.spend:(m===1?(r.cpa||0):(m===2?r.ctr:r.res));
  const withVal=rows.filter(r=>val(r)>0);
  const mx=Math.max.apply(null,withVal.map(val).concat([0.0001]));
  const fmt=v=>m===0?fmtB(v):(m===1?(v?fmtB(v):"—"):(m===2?fmtP(v):fmtN(v)));
  const label=["Spend","CPA","CTR","ผลลัพธ์"][m];
  let matched=0;
  const paths=THMAP.p.map(p=>{
    const r=byKey[provKey(p.n)];
    let fill="#14142A", tip=p.n+" — ไม่มีข้อมูลช่วงนี้";
    if(r){ matched++;
      const a=Math.max(0.12, val(r)/mx);
      fill = m===1? "rgba(255,138,61,"+(0.15+a*0.8).toFixed(2)+")" : "rgba(255,201,60,"+(0.12+a*0.82).toFixed(2)+")";
      tip = p.n+"\n"+label+": "+fmt(val(r))+"\nSpend "+fmtB(r.spend)+" • CTR "+fmtP(r.ctr)+" • CPA "+(r.cpa?fmtB(r.cpa):"—")+" • ผลลัพธ์ "+fmtN(r.res);
      if(val(r)===0) fill="#1E1E38";
    }
    return '<path d="'+p.d+'" fill="'+fill+'" stroke="rgba(200,30,58,.35)" stroke-width="0.6" style="cursor:pointer" '+
      'onclick="toast(this.querySelector(\'title\').textContent.replace(/\\n/g,\'<br>\'),\'info\',6000)"><title>'+tip+'</title></path>';
  }).join("");
  box.innerHTML='<svg viewBox="'+THMAP.vb+'" style="width:100%;max-width:430px;height:auto;filter:drop-shadow(0 0 14px rgba(200,30,58,.15))" xmlns="http://www.w3.org/2000/svg">'+paths+'</svg>';
  const note=$("geoMapNote");
  if(note) note.innerHTML="สีเข้ม = "+label+"สูง "+(m===1?"(สีเหลือง — ยิ่งเข้มยิ่งแพง)":"")+" • คลิกจังหวัดเพื่อดูตัวเลข • จับคู่ได้ "+matched+"/"+rows.length+" จังหวัดที่มีข้อมูล";
}

/* ---------- Admin: จัดการบัญชีลูกค้า (เห็นเฉพาะ role==='admin', server ก็เช็คสิทธิ์ซ้ำทุก request) ---------- */
async function adminFetch(path, method, body){
  const headers={"Content-Type":"application/json"};
  if(AUTH.token) headers["Authorization"]="Bearer "+AUTH.token;
  let r;
  try{ r = await fetch(AUTH_API+path,{method,headers,body: body!==undefined?JSON.stringify(body):undefined}); }
  catch(e){ throw new Error("เชื่อมต่อระบบล็อกอินไม่ได้ ตรวจสอบอินเทอร์เน็ต"); }
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error||"คำขอไม่สำเร็จ");
  return j;
}

function dateInputToMs(dateStr){ return dateStr? new Date(dateStr+"T23:59:59+07:00").getTime() : null; }
function msToDateInput(ms){ if(!ms) return ""; const d=new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function copyToClipboard(text){
  const done = ()=> toast("📋 คัดลอกแล้ว — นำไปวางส่งลูกค้าได้เลย","ok",2500);
  const fail = ()=> toast("❌ คัดลอกไม่สำเร็จ กรุณาคัดลอกด้วยตัวเอง","err",4500);
  const fallback = ()=>{
    try{
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      done();
    }catch(e){ fail(); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  }else fallback();
}

function adminOpenCreate(){
  openModal(`<h3>+ เพิ่มลูกค้าใหม่</h3>
    <label>Username (a-z 0-9 _ . - เท่านั้น)</label><input id="acUser" placeholder="เช่น somchai">
    <label>ชื่อที่แสดง</label><input id="acName" placeholder="เช่น ร้านสมชายค้าขาย">
    <label>Password (เว้นว่าง = สุ่มให้อัตโนมัติ)</label><input id="acPass" type="text" placeholder="อย่างน้อย 8 ตัวอักษร">
    <label>วันหมดอายุ (เว้นว่าง = ไม่มีวันหมดอายุ)</label><input id="acExp" type="date">
    <label>หมายเหตุ</label><input id="acNote" placeholder="เช่น แพ็กเกจ 6 เดือน">
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn" onclick="closeModal()">ยกเลิก</button>
      <button class="btn primary" id="acGo">สร้างบัญชี</button>
    </div>`);
  $("acGo").onclick = async ()=>{
    const username=$("acUser").value.trim().toLowerCase();
    if(!/^[a-z0-9_.\-]{3,32}$/.test(username)) return toast("Username ต้องเป็น a-z 0-9 _ . - ยาว 3-32 ตัว","warn");
    const btn=$("acGo"); btn.disabled=true; btn.innerHTML='<span class="spin"></span> กำลังสร้าง...';
    try{
      const body={username, displayName:$("acName").value.trim()||username, note:$("acNote").value.trim()};
      const pass=$("acPass").value.trim(); if(pass) body.password=pass;
      const exp=$("acExp").value; if(exp) body.expiresAt=dateInputToMs(exp);
      const j=await adminFetch("/admin/users","POST",body);
      closeModal();
      const finalPass = pass || j.password;
      if(finalPass) openCredentialsModal(username, finalPass, "สร้างบัญชีสำเร็จ");
      else toast("✅ สร้างบัญชีสำเร็จ","ok");
      adminRenderUsers();
    }catch(e){ btn.disabled=false; btn.innerHTML="สร้างบัญชี"; toast("❌ "+esc(e.message),"err",6000); }
  };
}

function adminOpenEdit(username){
  adminFetch("/admin/users","GET").then(j=>{
    const u=(j.users||[]).find(x=>x.username===username); if(!u) return;
    openModal(`<h3>แก้ไข: ${esc(username)}</h3>
      <label>ชื่อที่แสดง</label><input id="aeName" value="${esc(u.display_name||"")}">
      <label>วันหมดอายุ (เว้นว่าง = ไม่มีวันหมดอายุ)</label><input id="aeExp" type="date" value="${msToDateInput(u.expires_at)}">
      <label>หมายเหตุ</label><input id="aeNote" value="${esc(u.note||"")}">
      <label>ตั้งรหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)</label><input id="aePass" type="text" placeholder="อย่างน้อย 8 ตัวอักษร">
      <div class="row" style="justify-content:flex-end;margin-top:16px">
        <button class="btn" onclick="closeModal()">ยกเลิก</button>
        <button class="btn primary" id="aeGo">บันทึก</button>
      </div>`);
    $("aeGo").onclick = async ()=>{
      const btn=$("aeGo"); btn.disabled=true; btn.innerHTML='<span class="spin"></span> กำลังบันทึก...';
      try{
        const body={displayName:$("aeName").value.trim(), note:$("aeNote").value.trim(), expiresAt: $("aeExp").value? dateInputToMs($("aeExp").value) : null};
        const pass=$("aePass").value.trim(); if(pass){ if(pass.length<8) throw new Error("รหัสผ่านต้องอย่างน้อย 8 ตัวอักษร"); body.password=pass; }
        await adminFetch("/admin/users/"+encodeURIComponent(username),"PATCH",body);
        closeModal();
        if(pass) openCredentialsModal(username, pass, "ตั้งรหัสผ่านใหม่สำเร็จ");
        else toast("✅ บันทึกแล้ว","ok");
        adminRenderUsers();
      }catch(e){ btn.disabled=false; btn.innerHTML="บันทึก"; toast("❌ "+esc(e.message),"err",6000); }
    };
  }).catch(e=>toast("❌ "+esc(e.message),"err",6000));
}

function adminToggleStatus(username, newStatus){
  const verb = newStatus==="active" ? "เปิดใช้งาน" : "ระงับการใช้งาน";
  confirmAction(verb+"บัญชี "+username, newStatus==="disabled" ? "ลูกค้าจะเข้าสู่ระบบไม่ได้ทันทีจนกว่าจะเปิดใช้งานอีกครั้ง" : "ลูกค้าจะกลับมาเข้าสู่ระบบได้ตามปกติ", async ()=>{
    await adminFetch("/admin/users/"+encodeURIComponent(username),"PATCH",{status:newStatus});
    toast("✅ "+verb+"แล้ว","ok"); adminRenderUsers();
  });
}

function adminDeleteUser(username){
  confirmAction("ลบบัญชี "+username, "ลบแล้วลูกค้าคนนี้จะเข้าสู่ระบบไม่ได้อีก และกู้คืนไม่ได้ ต้องสร้างบัญชีใหม่หากต้องการให้ใช้งานอีก", async ()=>{
    await adminFetch("/admin/users/"+encodeURIComponent(username),"DELETE");
    toast("🗑️ ลบบัญชีแล้ว","ok"); adminRenderUsers();
  });
}
</script>
